<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>소수 돌파 드리블 · 종목 3</title>
<link rel="stylesheet" href="../css/jua.css">
<link rel="stylesheet" href="../css/style.css?v=4">
</head>
<body>

<div class="game-stage">
  <video id="video" playsinline muted style="display:none"></video>
  <canvas id="gameCanvas"></canvas>

  <div class="hud">
    <div class="rec" id="recIndicator" style="display:none"><span class="dot"></span>REC</div>
    <button class="home-btn" id="homeBtn">🏠</button>
  </div>

  <div class="overlay-panel" id="loadingPanel">
    <h2>⛹️ 소수 돌파 드리블</h2>
    <p id="loadingText">준비 중…</p>
  </div>

  <div class="overlay-panel" id="raisePanel" style="display:none">
    <div class="raise-icon" id="raiseIcon">🙋</div>
    <h2 id="raiseText">손을 들어 주세요!</h2>
    <p class="small-note" id="raiseNote">카메라에서 2~3걸음 물러나 온몸이 보이게 서 주세요</p>
    <div class="hold-bar"><div class="hold-fill" id="holdFill"></div></div>
  </div>

  <div class="overlay-panel ready-flash" id="readyPanel" style="display:none">
    <h2>✋ 좋아요! 준비됐어요</h2>
  </div>


  <div class="overlay-panel rule-card" id="rulePanel" style="display:none">
    <div class="rule-inner">
      <div class="rule-emoji">🎮</div>
      <div class="rule-title">종목</div>
      <div class="rule-text">규칙</div>
      <div class="rule-tag">READY?</div>
    </div>
  </div>

  <div class="overlay-panel start-stamp" id="startStamp" style="display:none">
    <div class="stamp-word">START!</div>
  </div>

  <div class="overlay-panel" id="countdownPanel" style="display:none">
    <div class="countdown-num" id="countNum">3</div>
  </div>

  <div class="overlay-panel" id="resultPanel" style="display:none">
    <h2 id="resultTitle">결과</h2>
    <div class="medal" id="resultMedal">🥉</div>
    <div class="record-ribbon" id="recordRibbon">🎉 NEW RECORD!</div>
    <div class="result-stats">
      <div class="stat-box"><div class="num" id="statCount">0골</div><div class="label">기록</div></div>
      <div class="stat-box"><div class="num" id="statBest">0골</div><div class="label">최고 기록</div></div>
      <div class="stat-box"><div class="num" id="statCombo">0</div><div class="label">최고 콤보</div></div>
    </div>
    <div class="coin-earn" id="coinEarn"></div>
    <video class="preview" id="previewVideo" controls playsinline style="display:none"></video>
    <div class="action-row">
      <button class="ghost-btn" id="savePhotoBtn">📸 사진</button>
      <button class="ghost-btn" id="saveVideoBtn" style="display:none">🎬 3초 영상</button>
      <button class="big-btn" id="retryBtn">🔁 한 번 더</button>
      <button class="ghost-btn" id="homeBtn2">🏠 종목 선택</button>
    </div>
  </div>
</div>

<script type="module">
import {
  HighScore, requestWakeLock, SoundKit, FileAudioLoop,
  ClipRecorder, downloadBlob,
  drawMirroredVideo, fitCanvasToScreen,
  AutoDifficulty, levelFromUrl, medalFor,
  scheduleAutoRecording, ComboShot, drawPhotoOverlay,
  ScreenShake, spawnPopup, updatePopups, drawPopups,
  spawnBigPopup, updateBigPopups, drawBigPopups,
  InputMode, PointerInput, StartGate, drawFallbackBackground,
  startCamera, formatFileTimestamp, fluidPx, showSoundHint,
  drawVignette, spawnConfetti, updateConfetti, drawConfetti,
} from "../js/engine.js?v=2";
import {
  CUTE, FONT, LANE_COLORS, drawSticker, drawStickerRect, drawChunkyText,
  spawnSparkles, updateSparkles, drawSparkles, makeDrifters, drawDrifters,
  drawBunting, drawGloveCursor, drawLevelStars,
} from "../js/cute.js?v=4";
import { PoseTracker, BodyInput, drawSkeleton } from "../js/pose.js?v=1";
import {
  ensureFont, Coins, Mascot, drawMood, spawnGrade, updateGrades, drawGrades,
  showRuleCard, showStartStamp, showResult, hudBand, drawHudPanel,
  drawTimeUrgency, poseHint, drawPoseHint,
} from "../js/party.js?v=1";
requestWakeLock();

const UNIT = "g3";
const TITLE = "소수 돌파 드리블";
const RECORD_SUFFIX = "골";
const MEDALS = { bronze: 5, silver: 8, gold: 12 };
const mode = InputMode.get();
const RULE = { emoji: "⛹️", title: "소수 돌파 드리블", rule: "농구공을 손에 들고, ☐에 들어갈 소수가 적힌 골대로 가져가면 슛! 골대는 좌우로 움직여요." };

const video = document.getElementById("video");
const canvas = document.getElementById("gameCanvas");
let dims = fitCanvasToScreen(canvas);
let drifters = makeDrifters(12, dims.w, dims.h);
window.addEventListener("resize", () => {
  dims = fitCanvasToScreen(canvas);
  drifters = makeDrifters(12, dims.w, dims.h);
  if (state === "playing" && wall) layoutHoops();
});

const sound = new SoundKit();
const bgm = new FileAudioLoop("../assets/sounds/subbgm.mp3", 0.32);
const isMuted = () => localStorage.getItem("smo_muted") === "1";

document.getElementById("homeBtn").addEventListener("click", () => { bgm.stop(); location.href = "../index.html"; });
document.getElementById("homeBtn2").addEventListener("click", () => { bgm.stop(); location.href = "../index.html"; });

function randInt(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }
function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }

// -------------------- 소수 --------------------
// 0.1 + 0.2 !== 0.3 이 되는 부동소수점 오차를 피하려고 1/100 단위 정수로만 계산하고,
// 화면에 찍을 때만 소수로 바꾼다.
function fmt(v) {
  if (v % 100 === 0) return (v / 100).toFixed(1);
  if (v % 10 === 0) return (v / 100).toFixed(1);
  return (v / 100).toFixed(2);
}

// 소수 한 자리 값(1/100 단위로는 10의 배수)
function d1(min, max) { return randInt(min, max) * 10; }
function d2(min, max) { return randInt(min, max); }

// 한 벽 = 한 문제. 빈칸이 어디에 오는지를 바꿔가며 덧셈·뺄셈을 모두 연습하게 한다.
function genWall(level) {
  let a, b, c, form;
  if (level === 1) {
    a = d1(1, 8); b = d1(1, 9 - a / 10 + 1);
    b = Math.max(10, Math.min(b, 190 - a));
    c = a + b;
    form = ["a+_=c", "_+b=c", "a+b=_"][randInt(0, 2)];
  } else if (level === 2) {
    a = d2(15, 180); b = d2(15, 180);
    // 받아올림·받아내림이 반드시 생기도록 끝자리를 조정한다
    if ((a % 10) + (b % 10) < 10) b += 10 - ((a % 10) + (b % 10)) + randInt(0, 3);
    c = a + b;
    form = ["a+_=c", "_+b=c", "a-_=c", "a+b=_"][randInt(0, 3)];
    if (form === "a-_=c") { c = a; a = a + b; }
  } else {
    // 자릿수가 다른 소수끼리 — "0.5 + 0.15" 같은 자리 맞추기가 핵심
    a = Math.random() < 0.5 ? d1(1, 19) : d2(15, 195);
    b = a % 10 === 0 ? d2(11, 189) : d1(1, 19);
    c = a + b;
    form = ["a+_=c", "_+b=c", "a-_=c", "a+b=_"][randInt(0, 3)];
    if (form === "a-_=c") { c = a; a = a + b; }
  }

  let answer, text;
  if (form === "a+_=c") { answer = c - a; text = `${fmt(a)} + ☐ = ${fmt(c)}`; }
  else if (form === "_+b=c") { answer = c - b; text = `☐ + ${fmt(b)} = ${fmt(c)}`; }
  else if (form === "a-_=c") { answer = a - c; text = `${fmt(a)} − ☐ = ${fmt(c)}`; }
  else { answer = c; text = `${fmt(a)} + ${fmt(b)} = ☐`; }

  // 오답: 자리를 안 맞추고 계산하거나, 받아올림을 빠뜨렸을 때 나오는 값
  const misplace = (x, y) => {
    // 0.5 + 0.15 를 "5+15=20"처럼 오른쪽 끝만 맞춰 더했을 때 나오는 값
    const xs = x % 100 === 0 ? x / 100 : x % 10 === 0 ? x / 10 : x;
    const ys = y % 100 === 0 ? y / 100 : y % 10 === 0 ? y / 10 : y;
    return (xs + ys) * (x % 10 === 0 && y % 10 === 0 ? 10 : 1);
  };
  const pool = level === 1
    ? [answer + 10, answer - 10, answer + 20, Math.abs(answer - 20)]
    : [misplace(a, b), answer + 10, answer - 10, answer + 1, answer - 1, answer + 100, Math.abs(answer - 90)];
  const opts = [answer];
  for (const p of shuffle(pool)) {
    if (opts.length >= (level === 1 ? 2 : 3)) break;
    if (p <= 0 || p > 900) continue;
    if (opts.some((o) => o === p)) continue;
    opts.push(p);
  }
  while (opts.length < 2) opts.push(answer + 10 * opts.length);
  return { text, answer, options: shuffle(opts) };
}

const poseTracker = new PoseTracker();
const body = new BodyInput(mode);
let pointerInput = null;

async function init() {
  await ensureFont();
  if (!isMuted()) bgm.play(showSoundHint);
  if (mode === "motion") {
    try {
      await startCamera(video, { width: 640, height: 480 });
      if (!isMuted()) bgm.play(showSoundHint);
    } catch (e) {
      document.getElementById("loadingText").textContent = "⚠️ 카메라를 찾을 수 없어요. 카메라 권한을 확인해주세요.";
      return;
    }
    document.getElementById("loadingText").textContent = "온몸 인식 AI를 불러오는 중…";
    await poseTracker.init();
  } else {
    pointerInput = new PointerInput(canvas);
  }
  document.getElementById("loadingPanel").style.display = "none";
  document.getElementById("raiseIcon").textContent = mode === "motion" ? "🙋" : "👆";
  document.getElementById("raiseText").textContent = mode === "motion" ? "손을 들어 주세요!" : "화면을 터치(클릭)하면 시작!";
  document.getElementById("raiseNote").style.display = mode === "motion" ? "block" : "none";
  document.getElementById("raisePanel").style.display = "flex";
  state = "raise";
  requestAnimationFrame(loop);
}

let state = "loading";
const holdFill = document.getElementById("holdFill");
const startGate = new StartGate(mode, holdFill);

let autoDiff, count, combo, maxCombo, playEndAt;
let wall, hoops, resolving, wallAt, flashUntil = 0;
let shot = null;        // 날아가는 공 { from, to, start, dur, ok, hoop }
let shotClockLeft = 0;  // 농구 24초 룰처럼 한 문제를 붙들 수 있는 시간(ms, 프레임 dt로 깎는다)
let shotClockTotal = 1;
let ballHome = null;    // 공이 얹혀 있는 손 위치
let popups = [], bigPopups = [], confetti = [], sparks = [];
const shake = new ScreenShake();
const mascot = new Mascot();
let grades = [];
let recorder, comboShot, fallbackShot, autoRec, recordedBlob = null;
const recIndicator = document.getElementById("recIndicator");
let cursors = [];
let lastFrameAt = performance.now();

function topBand() { return hudBand(dims); }
function hoopSize() { return fluidPx(dims, 76, { min: 56, max: 108 }); }
function hoopY() { return dims.h * 0.40; }
function ballR() { return fluidPx(dims, 34, { min: 25, max: 50 }); }

// 골대는 각자 자기 구역 안에서 좌우로 오간다 — 서로 겹치지 않으면서 "슛 타이밍"이 생긴다
function layoutHoops() {
  const { w } = dims;
  const n = wall.options.length;
  const S = hoopSize();
  const margin = w * 0.05;
  const lane = (w - margin * 2) / n;
  hoops = wall.options.map((v, i) => {
    const x0 = margin + lane * i + S * 0.8;
    const x1 = margin + lane * (i + 1) - S * 0.8;
    return {
      v, idx: i, x0, x1,
      x: (x0 + x1) / 2,
      dir: i % 2 ? 1 : -1,
      speed: x1 - x0 > 8 ? w * (0.018 + 0.016 * autoDiff.level) : 0,
      y: hoopY(),
      color: LANE_COLORS[i % LANE_COLORS.length],
      swish: 0,
    };
  });
}

function newProblem() {
  wall = genWall(autoDiff.level);
  layoutHoops();
  resolving = false;
  shot = null;
  ballHome = ballHome || { x: dims.w / 2, y: dims.h * 0.82 };
  wallAt = performance.now();
  shotClockTotal = [0, 14000, 12000, 10000][autoDiff.level];
  shotClockLeft = shotClockTotal;
}

function startCountdown() {
  state = "countdown";
  document.getElementById("countdownPanel").style.display = "flex";
  const numEl = document.getElementById("countNum");
  let n = 3;
  numEl.textContent = n;
  if (!isMuted()) sound.countBeep();
  const iv = setInterval(() => {
    n--;
    if (n <= 0) {
      clearInterval(iv);
      document.getElementById("countdownPanel").style.display = "none";
      if (!isMuted()) sound.go();
      showStartStamp(document.getElementById("startStamp"));
      beginPlay();
    } else {
      numEl.textContent = n;
      if (!isMuted()) sound.countBeep();
    }
  }, 700);
}

function beginPlay() {
  state = "playing";
  const prev = HighScore.get(UNIT);
  autoDiff = new AutoDifficulty(levelFromUrl(AutoDifficulty.startLevelFromHighScore(prev)));
  count = 0; combo = 0; maxCombo = 0;
  popups = []; bigPopups = []; confetti = []; sparks = [];
  playEndAt = performance.now() + 60000;
  lastFrameAt = performance.now();
  newProblem();

  recorder = new ClipRecorder(canvas, sound, 24);
  recorder.prepare();
  comboShot = new ComboShot(canvas);
  fallbackShot = new ComboShot(canvas);
  autoRec = scheduleAutoRecording(recorder, {
    onStartVisual: () => {
      recIndicator.style.display = "flex";
      setTimeout(() => { if (!comboShot.captured) fallbackShot.capture(canvas); }, 1500);
    },
    onEndVisual: () => { recIndicator.style.display = "none"; },
    onDone: (blob) => { recordedBlob = blob; },
    fallbackMs: 8000,
  });
}

// 공을 든 손이 골대에 닿으면 슛이 나간다. 공이 날아가는 동안은 결과를 미뤄 둔다.
function shoot(hp) {
  if (resolving) return;
  resolving = true;
  const from = ballHome || { x: dims.w / 2, y: dims.h * 0.85 };
  const ok = hp.v === wall.answer;
  shot = { from: { x: from.x, y: from.y }, to: { x: hp.x, y: hp.y }, start: performance.now(), dur: 520, ok, hoop: hp };
  if (!isMuted()) sound.pop();
  setTimeout(() => {
    if (state !== "playing") return;
    if (ok) scoreGoal(hp); else airball(hp);
  }, 520);
}

function scoreGoal(hp) {
  hp.swish = performance.now();
  count++; combo++;
  mascot.cheer();
  spawnGrade(grades, dims.w / 2, dims.h * 0.60, combo);
  if (combo > maxCombo) { maxCombo = combo; comboShot.capture(canvas); }
  autoDiff.reportCorrect();
  autoRec.trigger();
  shake.trigger(8, 180);
  spawnSparkles(sparks, hp.x, hp.y, 22, ["#fff", CUTE.sun, CUTE.green]);
  spawnConfetti(confetti, hp.x, hp.y, 38);
  spawnBigPopup(bigPopups, dims.w / 2, dims.h * 0.66, `🏀 골인! ${count}골`, CUTE.sun);
  if (!isMuted()) { sound.success(); if (combo >= 3 && combo % 3 === 0) sound.fever(); }
  setTimeout(() => { if (state === "playing") newProblem(); }, 900);
}

// 오답이면 림에 튕겨 나온다(에어볼) — 실패지만 덜 무섭게
function airball(hp) {
  combo = 0;
  mascot.oops();
  autoDiff.reportWrong();
  shake.trigger(5, 160);
  flashUntil = performance.now() + 450;
  spawnPopup(popups, hp.x, hp.y - hoopSize() * 0.5, "튕겨 나왔어요!", CUTE.red);
  if (!isMuted()) sound.fizzle();
  setTimeout(() => { if (state === "playing") newProblem(); }, 850);
}

function timeUp() {
  if (resolving) return;
  resolving = true;
  combo = 0;
  mascot.oops();
  autoDiff.reportWrong();
  flashUntil = performance.now() + 450;
  spawnPopup(popups, dims.w / 2, dims.h * 0.7, "슛 시간이 지났어요!", CUTE.red);
  if (!isMuted()) sound.fizzle();
  setTimeout(() => { if (state === "playing") newProblem(); }, 800);
}

function endGame() {
  state = "result";
  const { medal, label } = medalFor(count, MEDALS);
  const prev = HighScore.get(UNIT);
  const best = Math.max(count, prev ? prev.count : 0);
  const isNewRecord = count > 0 && (!prev || count > prev.count);
  const earned = Coins.earn(medal, maxCombo);
  Coins.add(earned);
  if (!prev || count >= prev.count) {
    HighScore.set(UNIT, { count, bestLevel: autoDiff.level, label: `${medal} ${count}${RECORD_SUFFIX}`, at: Date.now() });
  }

  const shot = comboShot.captured ? comboShot : fallbackShot;
  const previewVideo = document.getElementById("previewVideo");
  const saveVideoBtn = document.getElementById("saveVideoBtn");
  if (recordedBlob) {
    previewVideo.src = URL.createObjectURL(recordedBlob);
    previewVideo.style.display = "block";
    saveVideoBtn.style.display = "inline-block";
  }
  document.getElementById("savePhotoBtn").onclick = async () => {
    const blob = await shot.toBlob((c, w, h) => drawPhotoOverlay(c, w, h, { title: TITLE, record: count + RECORD_SUFFIX, medal }));
    downloadBlob(blob, `수학체육올림픽_소수드리블_${formatFileTimestamp()}.png`);
  };
  document.getElementById("saveVideoBtn").onclick = () => {
    if (recordedBlob) downloadBlob(recordedBlob, `수학체육올림픽_소수드리블_${formatFileTimestamp()}.${recorder.extension}`);
  };
  showResult({
    panel: document.getElementById("resultPanel"),
    medalEl: document.getElementById("resultMedal"),
    titleEl: document.getElementById("resultTitle"),
    ribbonEl: document.getElementById("recordRibbon"),
    coinEl: document.getElementById("coinEarn"),
    medal, title: `${label}!`,
    stats: [
      { el: document.getElementById("statCount"), value: count, suffix: "골" },
      { el: document.getElementById("statBest"), value: best, suffix: "골" },
      { el: document.getElementById("statCombo"), value: maxCombo, prefix: "🔥" },
    ],
    newRecord: isNewRecord,
    coins: earned,
    sound, muted: isMuted(),
  });
}

document.getElementById("retryBtn").addEventListener("click", () => {
  document.getElementById("resultPanel").style.display = "none";
  document.getElementById("raisePanel").style.display = "flex";
  startGate.since = 0; startGate.ready = false; holdFill.style.width = "0%";
  state = "raise";
});

document.getElementById("raisePanel").addEventListener("click", () => {
  if (state === "raise" && mode !== "motion") goReady();
});

function drawCourt(ctx) {
  const { w, h } = dims;
  const band = topBand();
  ctx.save();
  const grad = ctx.createLinearGradient(0, band.y1, 0, h);
  grad.addColorStop(0, "rgba(240,140,60,0.14)");
  grad.addColorStop(1, "rgba(180,80,30,0.26)");
  ctx.fillStyle = grad;
  ctx.fillRect(0, band.y1, w, h - band.y1);
  ctx.strokeStyle = "rgba(255,255,255,0.30)";
  ctx.lineWidth = 3;
  for (let i = 1; i < 5; i++) {
    const y = band.y1 + ((h - band.y1) * i) / 5;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  }
  ctx.restore();
}

function loop(tsMs) {
  requestAnimationFrame(loop);
  if (mode === "motion" && video.readyState < 2) return;
  const { ctx, w, h } = dims;
  ctx.save();
  shake.apply(ctx);
  if (mode === "motion") drawMirroredVideo(ctx, video, w, h);
  else drawFallbackBackground(ctx, w, h);
  drawDrifters(ctx, drifters, dims, 1 / 60);
  drawBunting(ctx, dims);

  let result = null;
  if (mode === "motion") result = poseTracker.detect(video, tsMs);
  body.update(result, w, h, video, pointerInput);
  if (mode === "motion" && state === "raise") {
    if (startGate.update(tsMs, body.isReady())) goReady();
  }
  cursors = body.cursors();

  if (state === "playing") stepGame();
  if (mode === "motion") drawSkeleton(ctx, body.joints, { color: CUTE.sun, lineWidth: fluidPx(dims, 7, { min: 5, max: 10 }) });

  if (state === "playing" || state === "raise") {
    grades = updateGrades(grades);
    drawGrades(ctx, grades, dims, fluidPx);
    if (state === "playing") mascot.draw(ctx, dims, fluidPx);
    drawPoseHint(ctx, dims, fluidPx, poseHint(body, mode));
  }

  for (const c of cursors) drawGloveCursor(ctx, c.x, c.y, fluidPx(dims, 44, { min: 32, max: 62 }), { active: !!shot });
  ctx.restore();
}

function goReady() {
  state = "ready";
  document.getElementById("raisePanel").style.display = "none";
  document.getElementById("readyPanel").style.display = "flex";
  if (!isMuted()) sound.click();
  setTimeout(async () => {
    document.getElementById("readyPanel").style.display = "none";
    await showRuleCard(document.getElementById("rulePanel"), RULE);
    startCountdown();
  }, 500);
}

function drawTopPanel(ctx, remain) {
  const band = drawHudPanel(ctx, dims, fluidPx, {
    left: "☐에 들어갈 소수의 골대에 슛!",
    right: `🔥 ${combo}   🏅 ${count}골   ⏱ ${Math.ceil(remain / 1000)}초`,
    headline: wall.text,
  });

  // 슛 클락 — 농구의 24초 룰처럼 한 문제를 붙들 수 있는 시간을 보여준다
  const left = Math.max(0, shotClockLeft);
  const total = Math.max(1, shotClockTotal);
  const bw = dims.w * 0.34, bh = fluidPx(dims, 12, { min: 9, max: 18 });
  const bx = dims.w / 2 - bw / 2, by = band.y1 + bh * 0.7;
  ctx.save();
  ctx.fillStyle = "rgba(29,43,77,0.5)";
  ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, bh / 2); ctx.fill();
  ctx.fillStyle = left / total < 0.3 ? CUTE.red : CUTE.sun;
  ctx.beginPath(); ctx.roundRect(bx, by, Math.max(bh, bw * (left / total)), bh, bh / 2); ctx.fill();
  ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, bh / 2); ctx.stroke();
  ctx.restore();
}

// 농구 골대 — 백보드에 소수가 적혀 있고, 골이 들어가면 그물이 출렁인다
function drawHoop(ctx, hp) {
  const S = hoopSize();
  const bw = S * 1.55, bh = S * 0.9, by = hp.y - S * 0.72;
  drawStickerRect(ctx, hp.x, by, bw, bh, S * 0.16, CUTE.cream, {
    lineWidth: Math.max(3, S * 0.07), drop: Math.max(3, S * 0.06),
  });
  drawChunkyText(ctx, fmt(hp.v), hp.x, by, Math.min(bh * 0.58, bw * 0.32), hp.color,
    { outline: CUTE.ink, outlineWidth: Math.max(3, S * 0.075) });

  ctx.save();
  ctx.strokeStyle = "#ff7043";
  ctx.lineWidth = Math.max(4, S * 0.1);
  ctx.beginPath(); ctx.ellipse(hp.x, hp.y, S * 0.46, S * 0.13, 0, 0, Math.PI * 2); ctx.stroke();

  const since = performance.now() - hp.swish;
  const swish = hp.swish && since < 700 ? 1 - since / 700 : 0;
  ctx.strokeStyle = "rgba(255,255,255,0.9)";
  ctx.lineWidth = Math.max(1.5, S * 0.035);
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2;
    const sx = hp.x + Math.cos(a) * S * 0.46, sy = hp.y + Math.sin(a) * S * 0.13;
    const wob = Math.sin(performance.now() / 60 + i) * S * 0.12 * swish;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.quadraticCurveTo(sx + wob, hp.y + S * 0.3, hp.x + Math.cos(a) * S * 0.16 + wob * 0.6, hp.y + S * (0.5 + swish * 0.18));
    ctx.stroke();
  }
  ctx.restore();
}

// 눈이 달린 농구공. 손에 얹혀 따라다니다가 슛하면 날아간다.
function drawBall(ctx, x, y, r) {
  drawSticker(ctx, x, y, r, CUTE.orange, { lineWidth: Math.max(3, r * 0.2) });
  ctx.save();
  ctx.strokeStyle = CUTE.ink;
  ctx.lineWidth = Math.max(2, r * 0.1);
  ctx.lineCap = "round";
  ctx.globalAlpha = 0.55;
  ctx.beginPath(); ctx.moveTo(x - r * 0.95, y); ctx.lineTo(x + r * 0.95, y); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(x, y, r * 0.42, r * 0.95, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
  drawMood(ctx, x, y, r * 0.8, "idle");
}

function stepGame() {
  const { ctx, w, h } = dims;
  const now = performance.now();
  const dt = Math.min(0.06, (now - lastFrameAt) / 1000);
  lastFrameAt = now;
  const remain = Math.max(0, playEndAt - now);
  if (remain <= 0) { endGame(); return; }
  const armed = now - wallAt > 550;
  const S = hoopSize();
  const R = ballR();

  // 골대가 자기 구역 안에서 좌우로 오간다
  if (!resolving) {
    for (const hp of hoops) {
      if (!hp.speed) continue;
      hp.x += hp.dir * hp.speed * dt;
      if (hp.x < hp.x0) { hp.x = hp.x0; hp.dir = 1; }
      if (hp.x > hp.x1) { hp.x = hp.x1; hp.dir = -1; }
    }
  }

  // 공은 손 위에 얹혀 따라다닌다
  if (cursors.length) ballHome = { x: cursors[0].x, y: cursors[0].y - R * 1.15 };

  // 공을 든 손이 골대에 닿으면 슛
  if (armed && !resolving && ballHome) {
    for (const c of cursors) {
      const bx = c.x, by = c.y - R * 1.15;
      const hp = hoops.find((h) => Math.hypot(bx - h.x, by - h.y) < S * 0.7);
      if (hp) { shoot(hp); return; }
    }
  }
  // 슛 클락을 넘기면 공격권을 잃는다
  if (!resolving) {
    shotClockLeft -= dt * 1000;
    if (shotClockLeft <= 0) { timeUp(); return; }
  }

  drawCourt(ctx);
  drawTopPanel(ctx, remain);

  for (const hp of hoops) drawHoop(ctx, hp);

  // 날아가는 공 — 오답이면 림에 맞고 튕겨 나온다
  if (shot) {
    const t = Math.min(1, (now - shot.start) / shot.dur);
    let bx = shot.from.x + (shot.to.x - shot.from.x) * t;
    let by = shot.from.y + (shot.to.y - shot.from.y) * t - Math.sin(Math.PI * t) * h * 0.16;
    if (!shot.ok && t > 0.8) {
      const k = (t - 0.8) / 0.2;
      bx += k * S * 0.7;
      by += k * S * 0.5;
    }
    ctx.save();
    ctx.translate(bx, by);
    ctx.rotate(t * Math.PI * 2);
    drawBall(ctx, 0, 0, R);
    ctx.restore();
  } else if (ballHome) {
    drawBall(ctx, ballHome.x, ballHome.y, R);
  }


  if (now < flashUntil) {
    ctx.save();
    ctx.fillStyle = "rgba(255,107,107,0.18)";
    ctx.fillRect(0, 0, w, h);
    ctx.restore();
  }

  confetti = updateConfetti(confetti, dt); drawConfetti(ctx, confetti);
  sparks = updateSparkles(sparks, dt); drawSparkles(ctx, sparks);
  popups = updatePopups(popups, dt); drawPopups(ctx, popups);
  bigPopups = updateBigPopups(bigPopups, dt); drawBigPopups(ctx, bigPopups);

  drawVignette(ctx, w, h, 0.16);
  drawChunkyText(ctx, "공을 들고 정답 골대로 가져가면 슛!", w / 2, h * 0.955,
    fluidPx(dims, 16, { min: 12, max: 21 }), "#ffffff",
    { outline: CUTE.ink, outlineWidth: fluidPx(dims, 5, { min: 3, max: 7 }) });
  drawTimeUrgency(ctx, dims, fluidPx, remain);
  drawLevelStars(ctx, dims, autoDiff.level, fluidPx);
}

init();
</script>
