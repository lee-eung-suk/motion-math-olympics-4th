    <div class="coin-earn" id="coinEarn"></div>
    <video class="preview" id="previewVideo" controls playsinline style="display:none"></video>
    <div class="action-row">
      <button class="ghost-btn" id="savePhotoBtn">📸 사진</button>
      <button class="ghost-btn" id="saveVideoBtn" style="display:none">🎬 3초 영상</button>
      <button class="big-btn" id="retryBtn">🔁 한 번 더</button>

<script type="module">

import {

  Fever, drawFeverFrame, drawAnswerRing, Reveal,
} from "../js/party.js?v=1";
requestWakeLock();

const UNIT = "g4";
const TITLE = "사각형 뒤집기 패스";
const RECORD_SUFFIX = "개";
const MEDALS = { bronze: 5, silver: 8, gold: 11 };
const mode = InputMode.get();
const RULE = { emoji: "🤾", title: "사각형 뒤집기 패스", rule: "조건에 맞는 조각을 잡으면 손을 따라와요. 몸을 좌우로 기울여 45°씩 돌린 뒤, 수비 블록의 빈틈으로 가져가면 쏙!" };

const video = document.getElementById("video");
const canvas = document.getElementById("gameCanvas");
let dims = fitCanvasToScreen(canvas);
let drifters = makeDrifters(12, dims.w, dims.h);
window.addEventListener("resize", () => {
  dims = fitCanvasToScreen(canvas);
  drifters = makeDrifters(12, dims.w, dims.h);
  if (state === "playing") layoutPieces();
});

const sound = new SoundKit();
const bgm = new FileAudioLoop("../assets/sounds/subbgm.mp3", 0.32);
const isMuted = () => localStorage.getItem("smo_muted") === "1";

document.getElementById("homeBtn").addEventListener("click", () => { bgm.stop(); location.href = "../index.html"; });
document.getElementById("homeBtn2").addEventListener("click", () => { bgm.stop(); location.href = "../index.html"; });

function randInt(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }

// -------------------- 사각형 --------------------
// trap = 평행한 변이 한 쌍이라도 있는가(=사다리꼴), para = 평행사변형, rhom = 마름모, rect = 직사각형
const SHAPES = [
  { key: "square", name: "정사각형", trap: 1, para: 1, rhom: 1, rect: 1,
    pts: [[-0.55, -0.55], [0.55, -0.55], [0.55, 0.55], [-0.55, 0.55]] },
  { key: "rect", name: "직사각형", trap: 1, para: 1, rhom: 0, rect: 1,
    pts: [[-0.75, -0.44], [0.75, -0.44], [0.75, 0.44], [-0.75, 0.44]] },
  { key: "rhom", name: "마름모", trap: 1, para: 1, rhom: 1, rect: 0,
    pts: [[0, -0.72], [0.62, 0], [0, 0.72], [-0.62, 0]] },
  { key: "para", name: "평행사변형", trap: 1, para: 1, rhom: 0, rect: 0,
    pts: [[-0.78, 0.42], [-0.34, -0.42], [0.78, -0.42], [0.34, 0.42]] },
  { key: "trap", name: "사다리꼴", trap: 1, para: 0, rhom: 0, rect: 0,
    pts: [[-0.78, 0.42], [-0.40, -0.42], [0.40, -0.42], [0.78, 0.42]] },
  { key: "gen", name: "사각형", trap: 0, para: 0, rhom: 0, rect: 0,
    pts: [[-0.72, 0.38], [-0.46, -0.48], [0.62, -0.28], [0.74, 0.46]] },
];

// 조건은 "맞는 것 1개 이상, 틀린 것 2개 이상"이 나오는 것만 쓴다.
// (예: "평행한 변이 한 쌍이라도 있는 사각형"은 여섯 중 다섯이 해당돼 오답 후보가 모자란다)
const CONDS = {
  1: [
    { text: "평행사변형", test: (s) => s.para },
    { text: "네 변의 길이가 모두 같은 사각형", test: (s) => s.rhom },
  ],
  2: [
    { text: "마름모", test: (s) => s.rhom },
    { text: "직사각형", test: (s) => s.rect },
    { text: "평행사변형", test: (s) => s.para },
    { text: "정사각형", test: (s) => s.rhom && s.rect },
  ],
  3: [
    { text: "마름모이면서 직사각형인 사각형", test: (s) => s.rhom && s.rect },
    { text: "평행사변형이지만 마름모는 아닌 사각형", test: (s) => s.para && !s.rhom },
    { text: "사다리꼴이지만 평행사변형은 아닌 사각형", test: (s) => s.trap && !s.para },
  ],
};

const TURNS = [45, 90, 135, 180];

function genRound(level) {
  const usable = CONDS[level].filter(
    (c) => SHAPES.some((s) => c.test(s)) && SHAPES.filter((s) => !c.test(s)).length >= 2,
  );
  const cond = pick(usable.length ? usable : CONDS[1]);
  const yes = SHAPES.filter((s) => cond.test(s));
  const no = SHAPES.filter((s) => !cond.test(s));
  const chosen = pick(yes);
  const others = shuffle([...no]).slice(0, 2);
  const pieces = shuffle([chosen, ...others]);
  const turn = level === 1 ? pick([90, 180]) : pick(TURNS);
  const dir = Math.random() < 0.5 ? -1 : 1; // 왼쪽/오른쪽으로 돌리기
  return { cond, pieces, answerKey: chosen.key, turn, dir };
}

const poseTracker = new PoseTracker();
const body = new BodyInput(mode);
let pointerInput = null;

async function init() {
  await ensureFont();
  if (!isMuted()) bgm.play(showSoundHint);
  if (mode === "motion") {
    try {
      await startCamera(video, { width: 640, height: 480 });
      if (!isMuted()) bgm.play(showSoundHint);
    } catch (e) {
      document.getElementById("loadingText").textContent = "⚠️ 카메라를 찾을 수 없어요. 카메라 권한을 확인해주세요.";
      return;
    }
    document.getElementById("loadingText").textContent = "온몸 인식 AI를 불러오는 중…";
    await poseTracker.init();
  } else {
    pointerInput = new PointerInput(canvas);
  }
  document.getElementById("loadingPanel").style.display = "none";
  document.getElementById("raiseIcon").textContent = mode === "motion" ? "🙋" : "👆";
  document.getElementById("raiseText").textContent = mode === "motion" ? "손을 들어 주세요!" : "화면을 터치(클릭)하면 시작!";
  document.getElementById("raiseNote").style.display = mode === "motion" ? "block" : "none";
  document.getElementById("raisePanel").style.display = "flex";
  state = "raise";
  requestAnimationFrame(loop);
}

let state = "loading";
const holdFill = document.getElementById("holdFill");
const startGate = new StartGate(mode, holdFill);

let autoDiff, count, combo, maxCombo, playEndAt;
let round, slots, phase, chosen, roundAt, resolving, flashUntil = 0;
let pieceDeg, snap = null;   // snap: 조각이 빈틈으로 빨려 들어가는 연출
let held = null;             // 손에 들고 있는 조각 { shape, x, y, color }
let turnLatch = true;        // 45°씩 '딸깍' 한 칸만 돌도록 하는 걸쇠
let gapX = 0, gapDir = 1;    // 수비 벽의 빈틈이 좌우로 오간다
let popups = [], bigPopups = [], confetti = [], sparks = [];
const shake = new ScreenShake();
const mascot = new Mascot();
const fever = new Fever();      // 3연속 정답이면 8초 피버
const reveal = new Reveal();    // 오답 뒤 정답을 잠깐 보여주는 상태
let feverBonus = 0;             // 피버 중에 맞힌 만큼 붙는 코인
let grades = [];
let recorder, comboShot, fallbackShot, autoRec, recordedBlob = null;
const recIndicator = document.getElementById("recIndicator");
let cursors = [];
let lastFrameAt = performance.now();

function topBand() { return hudBand(dims); }
function pieceR() { return fluidPx(dims, 70, { min: 50, max: 100 }); }
function blockY() { return dims.h * 0.30; }

function layoutPieces() {
  const { w, h } = dims;
  const R = pieceR();
  slots = round.pieces.map((s, i) => ({
    shape: s, idx: i,
    x: w * (0.20 + 0.30 * i),
    y: h * 0.62,
    color: LANE_COLORS[i % LANE_COLORS.length],
    R,
  }));
}

function newRound() {
  round = genRound(autoDiff.level);
  phase = "pick"; chosen = null; pieceDeg = 0; snap = null; held = null; turnLatch = true;
  gapX = dims.w / 2; gapDir = Math.random() < 0.5 ? -1 : 1;
  if (typeof turnRow !== "undefined" && turnRow) turnRow.style.display = "none";
  layoutPieces();
  resolving = false;
  roundAt = performance.now();
}

function startCountdown() {
  state = "countdown";
  document.getElementById("countdownPanel").style.display = "flex";
  const numEl = document.getElementById("countNum");
  let n = 3;
  numEl.textContent = n;
  if (!isMuted()) sound.countBeep();
  const iv = setInterval(() => {
    n--;
    if (n <= 0) {
      clearInterval(iv);
      document.getElementById("countdownPanel").style.display = "none";
      if (!isMuted()) sound.go();
      showStartStamp(document.getElementById("startStamp"));
      beginPlay();
    } else {
      numEl.textContent = n;
      if (!isMuted()) sound.countBeep();
    }
  }, 700);
}

function beginPlay() {
  state = "playing";
  const prev = HighScore.get(UNIT);
  autoDiff = new AutoDifficulty(levelFromUrl(AutoDifficulty.startLevelFromHighScore(prev)));
  count = 0; combo = 0; maxCombo = 0;
  fever.reset(); reveal.clear(); feverBonus = 0;
  popups = []; bigPopups = []; confetti = []; sparks = [];
  playEndAt = performance.now() + 60000;
  lastFrameAt = performance.now();
  newRound();

  recorder = new ClipRecorder(canvas, sound, 24);
  recorder.prepare();
  comboShot = new ComboShot(canvas);
  fallbackShot = new ComboShot(canvas);
  autoRec = scheduleAutoRecording(recorder, {
    onStartVisual: () => {
      recIndicator.style.display = "flex";
      setTimeout(() => { if (!comboShot.captured) fallbackShot.capture(canvas); }, 1500);
    },
    onEndVisual: () => { recIndicator.style.display = "none"; },
    onDone: (blob) => { recordedBlob = blob; },
    fallbackMs: 8000,
  });
}

function succeed() {
  if (resolving) return;
  resolving = true;
  snap = { start: performance.now() };
  count++; combo++;
  mascot.cheer();
  fever.hit(combo);
  if (fever.on) feverBonus += 2;
  spawnGrade(grades, dims.w / 2, dims.h * 0.52, combo);
  if (combo > maxCombo) { maxCombo = combo; comboShot.capture(canvas); }
  autoDiff.reportCorrect();
  autoRec.trigger();
  shake.trigger(8, 180);
  spawnSparkles(sparks, dims.w / 2, blockY(), 26, ["#fff", CUTE.sun, CUTE.green]);
  spawnConfetti(confetti, dims.w / 2, blockY(), 40);
  spawnBigPopup(bigPopups, dims.w / 2, dims.h * 0.44, `🤾 침투 성공! ${count}개`, CUTE.sun);
  if (!isMuted()) { sound.success(); if (combo >= 3 && combo % 3 === 0) sound.fever(); }
  setTimeout(() => { if (state === "playing") newRound(); }, 700);
}

function fail(x, y, msg) {
  if (resolving) return;
  resolving = true;
  combo = 0;
  mascot.oops();
  fever.reset();
  autoDiff.reportWrong();
  shake.trigger(4, 150);
  flashUntil = performance.now() + 450;
  const ans = slots.find((s) => s.shape.key === round.answerKey);
  if (ans) reveal.show({ x: ans.x, y: ans.y, r: ans.R * 1.2, label: ans.shape.name });
  spawnPopup(popups, x, y, msg, CUTE.red);
  if (!isMuted()) sound.fizzle();
  setTimeout(() => { if (state === "playing") newRound(); }, 1400);
}

function endGame() {
  state = "result";
  const { medal, label } = medalFor(count, MEDALS);
  const prev = HighScore.get(UNIT);
  const best = Math.max(count, prev ? prev.count : 0);
  const isNewRecord = count > 0 && (!prev || count > prev.count);
  const earned = Coins.earn(medal, maxCombo) + feverBonus;
  Coins.add(earned);
  if (!prev || count >= prev.count) {
    HighScore.set(UNIT, { count, bestLevel: autoDiff.level, label: `${medal} ${count}${RECORD_SUFFIX}`, at: Date.now() });
  }

  const shot = comboShot.captured ? comboShot : fallbackShot;
  const previewVideo = document.getElementById("previewVideo");
  const saveVideoBtn = document.getElementById("saveVideoBtn");
  if (recordedBlob) {
    previewVideo.src = URL.createObjectURL(recordedBlob);
    previewVideo.style.display = "block";
    saveVideoBtn.style.display = "inline-block";
  }
  document.getElementById("savePhotoBtn").onclick = async () => {
    const blob = await shot.toBlob((c, w, h) => drawPhotoOverlay(c, w, h, { title: TITLE, record: count + RECORD_SUFFIX, medal }));
    downloadBlob(blob, `수학체육올림픽_사각형패스_${formatFileTimestamp()}.png`);
  };
  document.getElementById("saveVideoBtn").onclick = () => {
    if (recordedBlob) downloadBlob(recordedBlob, `수학체육올림픽_사각형패스_${formatFileTimestamp()}.${recorder.extension}`);
  };
  showResult({
    panel: document.getElementById("resultPanel"),
    medalEl: document.getElementById("resultMedal"),
    titleEl: document.getElementById("resultTitle"),
    ribbonEl: document.getElementById("recordRibbon"),
    coinEl: document.getElementById("coinEarn"),
    medal, title: `${label}!`,
    stats: [
      { el: document.getElementById("statCount"), value: count, suffix: "개" },
      { el: document.getElementById("statBest"), value: best, suffix: "개" },
      { el: document.getElementById("statCombo"), value: maxCombo, prefix: "🔥" },
    ],
    newRecord: isNewRecord,
    coins: earned,
    sound, muted: isMuted(),
  });
}

document.getElementById("retryBtn").addEventListener("click", () => {
  document.getElementById("resultPanel").style.display = "none";
  document.getElementById("raisePanel").style.display = "flex";
  startGate.since = 0; startGate.ready = false; holdFill.style.width = "0%";
  state = "raise";
});

document.getElementById("raisePanel").addEventListener("click", () => {
  if (state === "raise" && mode !== "motion") goReady();
});

// -------------------- 사각형 그리기 --------------------
// 각도·길이를 숫자로 적어주지 않고, 같은 길이 변의 눈금과 직각 표시만으로 판단하게 한다.
function drawQuad(ctx, shape, cx, cy, R, rotDeg, fill, opts = {}) {
  const rot = (rotDeg * Math.PI) / 180;
  const p = shape.pts.map(([x, y]) => ({
    x: cx + (x * Math.cos(rot) - y * Math.sin(rot)) * R,
    y: cy + (x * Math.sin(rot) + y * Math.cos(rot)) * R,
  }));
  const lw = Math.max(3, R * 0.1);
  ctx.save();
  ctx.lineJoin = "round";
  if (opts.ghost) {
    ctx.beginPath();
    p.forEach((q, i) => (i === 0 ? ctx.moveTo(q.x, q.y) : ctx.lineTo(q.x, q.y)));
    ctx.closePath();
    ctx.setLineDash([R * 0.16, R * 0.12]);
    ctx.strokeStyle = fill;
    ctx.lineWidth = lw * 0.8;
    ctx.stroke();
    ctx.restore();
    return p;
  }
  ctx.beginPath();
  p.forEach((q, i) => (i === 0 ? ctx.moveTo(q.x, q.y + lw) : ctx.lineTo(q.x, q.y + lw)));
  ctx.closePath();
  ctx.fillStyle = "rgba(29,43,77,0.35)";
  ctx.fill();

  ctx.beginPath();
  p.forEach((q, i) => (i === 0 ? ctx.moveTo(q.x, q.y) : ctx.lineTo(q.x, q.y)));
  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.strokeStyle = CUTE.ink;
  ctx.lineWidth = lw;
  ctx.stroke();

  // 같은 길이의 변 눈금
  const len = shape.pts.map((_, i) => {
    const a = shape.pts[i], b = shape.pts[(i + 1) % 4];
    return Math.hypot(a[0] - b[0], a[1] - b[1]);
  });
  const groups = [];
  len.forEach((s, i) => {
    const g = groups.find((gr) => Math.abs(gr.len - s) < 0.02);
    if (g) g.idx.push(i); else groups.push({ len: s, idx: [i] });
  });
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = Math.max(2, R * 0.055);
  ctx.lineCap = "round";
  groups.forEach((g, gi) => {
    if (g.idx.length < 2) return;
    for (const si of g.idx) {
      const a = p[si], b = p[(si + 1) % 4];
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      const ux = b.x - a.x, uy = b.y - a.y;
      const L = Math.hypot(ux, uy) || 1;
      const nx = -uy / L, ny = ux / L;
      const ticks = gi + 1;
      for (let t = 0; t < ticks; t++) {
        const off = (t - (ticks - 1) / 2) * R * 0.12;
        const px = mx + (ux / L) * off, py = my + (uy / L) * off;
        ctx.beginPath();
        ctx.moveTo(px - nx * R * 0.085, py - ny * R * 0.085);
        ctx.lineTo(px + nx * R * 0.085, py + ny * R * 0.085);
        ctx.stroke();
      }
    }
  });

  // 직각 표시
  for (let i = 0; i < 4; i++) {
    const v = shape.pts[i], a = shape.pts[(i + 3) % 4], b = shape.pts[(i + 1) % 4];
    const u1 = [a[0] - v[0], a[1] - v[1]], u2 = [b[0] - v[0], b[1] - v[1]];
    const n1 = Math.hypot(u1[0], u1[1]), n2 = Math.hypot(u2[0], u2[1]);
    const cos = (u1[0] * u2[0] + u1[1] * u2[1]) / (n1 * n2);
    if (Math.abs(cos) > 0.03) continue;
    const V = p[i], A = p[(i + 3) % 4], B = p[(i + 1) % 4];
    const d1 = { x: (A.x - V.x) / Math.hypot(A.x - V.x, A.y - V.y), y: (A.y - V.y) / Math.hypot(A.x - V.x, A.y - V.y) };
    const d2 = { x: (B.x - V.x) / Math.hypot(B.x - V.x, B.y - V.y), y: (B.y - V.y) / Math.hypot(B.x - V.x, B.y - V.y) };
    const s = R * 0.2;
    ctx.beginPath();
    ctx.moveTo(V.x + d1.x * s, V.y + d1.y * s);
    ctx.lineTo(V.x + d1.x * s + d2.x * s, V.y + d1.y * s + d2.y * s);
    ctx.lineTo(V.x + d2.x * s, V.y + d2.y * s);
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = Math.max(2, R * 0.05);
    ctx.stroke();
  }
  ctx.restore();
  return p;
}

function loop(tsMs) {
  requestAnimationFrame(loop);
  if (mode === "motion" && video.readyState < 2) return;
  const { ctx, w, h } = dims;
  ctx.save();
  shake.apply(ctx);
  if (mode === "motion") drawMirroredVideo(ctx, video, w, h);
  else drawFallbackBackground(ctx, w, h);
  drawDrifters(ctx, drifters, dims, 1 / 60);
  drawBunting(ctx, dims);

  let result = null;
  if (mode === "motion") result = poseTracker.detect(video, tsMs);
  body.update(result, w, h, video, pointerInput);
  if (mode === "motion" && state === "raise") {
    if (startGate.update(tsMs, body.isReady())) goReady();
  }
  cursors = body.cursors();

  if (state === "playing") stepGame();
  if (mode === "motion") drawSkeleton(ctx, body.joints, { color: CUTE.sun, lineWidth: fluidPx(dims, 7, { min: 5, max: 10 }) });

  if (state === "playing" || state === "raise") {
    grades = updateGrades(grades);
    drawGrades(ctx, grades, dims, fluidPx);
    if (state === "playing") mascot.draw(ctx, dims, fluidPx);
    drawPoseHint(ctx, dims, fluidPx, poseHint(body, mode));
  }

  if (state === "playing") drawFeverFrame(ctx, dims, fever, fluidPx);

  for (const c of cursors) drawGloveCursor(ctx, c.x, c.y, fluidPx(dims, 44, { min: 32, max: 62 }), { active: phase === "turn" });
  ctx.restore();
}

// 45°씩 한 칸만 돈다 — 지나쳤다 되돌아오길 반복하던 문제를 없앤다
function rotatePiece(dir) {
  if (phase !== "turn" || resolving) return;
  pieceDeg = ((pieceDeg + dir * 45) % 360 + 360) % 360;
  if (!isMuted()) sound.click();
}

const turnRow = document.getElementById("turnRow");
document.getElementById("turnL").addEventListener("click", () => rotatePiece(-1));
document.getElementById("turnR").addEventListener("click", () => rotatePiece(1));

function goReady() {
  state = "ready";
  document.getElementById("raisePanel").style.display = "none";
  document.getElementById("readyPanel").style.display = "flex";
  if (!isMuted()) sound.click();
  setTimeout(async () => {
    document.getElementById("readyPanel").style.display = "none";
    await showRuleCard(document.getElementById("rulePanel"), RULE);
    startCountdown();
  }, 500);
}

function drawTopPanel(ctx, remain) {
  drawHudPanel(ctx, dims, fluidPx, {
    left: phase === "pick" ? "① 조건에 맞는 조각 잡기" : "② 몸을 돌려 각도 맞추기",
    right: `🔥 ${combo}   🏅 ${count}개   ⏱ ${Math.ceil(remain / 1000)}초`,
    headline: phase === "pick" ? round.cond.text : `${round.dir < 0 ? "왼쪽" : "오른쪽"}으로 ${round.turn}° 돌리기!`,
  });
}

// 수비 블록 — 가운데 빈틈으로만 패스가 들어간다.
// 밋밋한 회색 띠 대신 통통한 블록을 줄지어 쌓고, 가운데 블록에는 찡그린 표정을 붙였다.
function drawBlockWall(ctx, gapW) {
  const { w } = dims;
  const y = blockY();
  const th = fluidPx(dims, 34, { min: 26, max: 50 });
  const sides = [
    { x0: 0, x1: gapX - gapW / 2 },
    { x0: gapX + gapW / 2, x1: w },
  ];
  for (const s of sides) {
    const span = s.x1 - s.x0;
    if (span <= 0) continue;
    const n = Math.max(2, Math.round(span / (th * 1.5)));
    const bw = span / n;
    for (let i = 0; i < n; i++) {
      const cx = s.x0 + bw * (i + 0.5);
      drawStickerRect(ctx, cx, y, bw * 0.94, th, th * 0.28, i % 2 ? CUTE.blueDark : CUTE.blue, {
        lineWidth: Math.max(3, th * 0.13), drop: Math.max(3, th * 0.12),
      });
    }
    // 빈틈에 가장 가까운 블록만 표정을 지어 "여기를 막고 있다"가 읽히게 한다
    const guard = s.x0 === 0 ? s.x1 - bw * 0.5 : s.x0 + bw * 0.5;
    drawMood(ctx, guard, y, th * 0.42, "sad");
  }
}

// 몸을 얼마나 돌렸는지 보여주는 회전 다이얼
function drawTurnDial(ctx, cx, cy, R, targetDeg, curDeg, ok) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(29,43,77,0.55)"; ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.6)"; ctx.lineWidth = Math.max(2, R * 0.05); ctx.stroke();

  // 45° 눈금
  ctx.strokeStyle = "rgba(255,255,255,0.5)";
  ctx.lineWidth = Math.max(1.5, R * 0.03);
  for (let d = 0; d < 360; d += 45) {
    const a = (d - 90) * Math.PI / 180;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * R * 0.82, Math.sin(a) * R * 0.82);
    ctx.lineTo(Math.cos(a) * R, Math.sin(a) * R);
    ctx.stroke();
  }
  // 목표
  const ta = (targetDeg - 90) * Math.PI / 180;
  ctx.strokeStyle = ok ? CUTE.green : CUTE.sun;
  ctx.lineWidth = Math.max(4, R * 0.11);
  ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(ta) * R * 0.92, Math.sin(ta) * R * 0.92); ctx.stroke();
  // 현재
  const ca = (curDeg - 90) * Math.PI / 180;
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = Math.max(3, R * 0.07);
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(ca) * R * 0.78, Math.sin(ca) * R * 0.78); ctx.stroke();
  ctx.restore();
}

function stepGame() {
  const { ctx, w, h } = dims;
  const now = performance.now();
  const dt = Math.min(0.06, (now - lastFrameAt) / 1000);
  lastFrameAt = now;
  const remain = Math.max(0, playEndAt - now);
  if (remain <= 0) { endGame(); return; }
  const armed = now - roundAt > 550;
  const R = pieceR();
  const gapW = R * 2.6;

  // 빈틈이 가만히 있으면 긴장감이 없다 — 벽이 좌우로 천천히 오간다
  if (!resolving) {
    gapX += gapDir * w * (0.028 + 0.018 * autoDiff.level) * dt;
    if (gapX < w * 0.26) { gapX = w * 0.26; gapDir = 1; }
    if (gapX > w * 0.74) { gapX = w * 0.74; gapDir = -1; }
  }

  const target = ((round.dir > 0 ? round.turn : 360 - round.turn) % 360 + 360) % 360;
  const angleOk = Math.abs(((pieceDeg - target + 540) % 360) - 180) <= 8;

  if (phase === "pick" && armed && !resolving) {
    let best = null, bestD = Infinity;
    for (const c of cursors) {
      for (const s of slots) {
        const d = Math.hypot(c.x - s.x, c.y - s.y);
        if (d < s.R * 1.1 && d < bestD) { bestD = d; best = s; }
      }
    }
    if (best) {
      if (best.shape.key === round.answerKey) {
        chosen = best;
        held = { shape: best.shape, color: best.color, x: best.x, y: best.y };
        phase = "turn"; pieceDeg = 0; turnLatch = true;
        roundAt = now;
        if (mode !== "motion") turnRow.style.display = "flex";
        spawnSparkles(sparks, best.x, best.y, 14, ["#fff", CUTE.sun]);
        spawnPopup(popups, best.x, best.y - best.R, "잡았다! 각도를 맞춰 빈틈으로", CUTE.green);
        if (!isMuted()) sound.pop();
      } else {
        fail(best.x, best.y - best.R, "조건을 다시 봐요!");
        return;
      }
    }
  } else if (phase === "turn" && !resolving) {
    // 조각은 손을 따라오고, 회전은 45°씩 딱 한 칸만 '딸깍' 돈다.
    // 예전에는 몸 기울기로 각속도를 조절해서, 원하는 각도에 딱 멈추기가 무척 어려웠다.
    if (cursors.length) { held.x = cursors[0].x; held.y = cursors[0].y; }

    if (mode === "motion") {
      const turn = body.torsoTurn();
      if (Math.abs(turn) < 0.25) turnLatch = true;
      else if (turnLatch) { rotatePiece(turn > 0 ? 1 : -1); turnLatch = false; }
    }

    // 각도가 맞은 채로 빈틈까지 가져가면 자석처럼 빨려 들어간다
    const inGap = Math.abs(held.x - gapX) < gapW * 0.6 && Math.abs(held.y - blockY()) < R * 1.5;
    if (armed && angleOk && inGap) { succeed(); return; }
  }

  drawBlockWall(ctx, gapW);
  drawTopPanel(ctx, remain);

  if (phase === "pick") {
    for (const s of slots) {
      const by = bob(1.5, s.R * 0.05, s.idx);
      drawQuad(ctx, s.shape, s.x, s.y + by, s.R, 0, s.color);
      drawMood(ctx, s.x, s.y + by, s.R * 0.38, "idle");
    }
    if (reveal.on) drawAnswerRing(ctx, dims, fluidPx, reveal.data.x, reveal.data.y, reveal.data.r, reveal.data.label);
    drawChunkyText(ctx, "조건에 맞는 사각형 조각을 손으로 잡아요!", w / 2, h * 0.92,
      fluidPx(dims, 16, { min: 12, max: 21 }), "#ffffff",
      { outline: CUTE.ink, outlineWidth: fluidPx(dims, 5, { min: 3, max: 7 }) });
  } else {
    // 빈틈에 목표 방향이 점선으로 떠 있어서, 어디까지 돌려야 하는지 눈으로 보인다
    drawQuad(ctx, chosen.shape, gapX, blockY(), R, target, angleOk ? CUTE.green : "#ffffff", { ghost: true });

    let px = held.x, py = held.y;
    if (snap) {
      const t = Math.min(1, (now - snap.start) / 420);
      const e = 1 - Math.pow(1 - t, 3);
      px = held.x + (gapX - held.x) * e;
      py = held.y + (blockY() - held.y) * e;
    }
    drawQuad(ctx, chosen.shape, px, py, R, pieceDeg, angleOk ? CUTE.green : chosen.color);
    drawMood(ctx, px, py, R * 0.34, angleOk ? "happy" : "wow");

    drawTurnDial(ctx, w * 0.9, h * 0.5, Math.min(w, h) * 0.09, target, pieceDeg, angleOk);

    drawChunkyText(
      ctx,
      angleOk ? "좋아요! 빈틈으로 가져가요" : (mode === "motion" ? "몸을 좌우로 기울여 45°씩 돌려요" : "아래 ↺ ↻ 단추로 45°씩 돌려요"),
      w / 2, h * 0.80, fluidPx(dims, 17, { min: 12, max: 22 }),
      angleOk ? CUTE.green : "#ffffff",
      { outline: CUTE.ink, outlineWidth: fluidPx(dims, 5, { min: 3, max: 7 }) },
    );
    drawChunkyText(ctx, `${Math.round(pieceDeg)}°`, w * 0.9, h * 0.5 + Math.min(w, h) * 0.145,
      fluidPx(dims, 22, { min: 16, max: 30 }), angleOk ? CUTE.green : CUTE.sun,
      { outline: CUTE.ink, outlineWidth: fluidPx(dims, 6, { min: 4, max: 8 }) });
  }

  if (now < flashUntil) {
    ctx.save();
    ctx.fillStyle = "rgba(255,107,107,0.18)";
    ctx.fillRect(0, 0, w, h);
    ctx.restore();
  }

  confetti = updateConfetti(confetti, dt); drawConfetti(ctx, confetti);
  sparks = updateSparkles(sparks, dt); drawSparkles(ctx, sparks);
  popups = updatePopups(popups, dt); drawPopups(ctx, popups);
  bigPopups = updateBigPopups(bigPopups, dt); drawBigPopups(ctx, bigPopups);

  drawVignette(ctx, w, h, 0.16);
  drawTimeUrgency(ctx, dims, fluidPx, remain);
  drawLevelStars(ctx, dims, autoDiff.level, fluidPx);
}

init();
</script>
