const sound = new SoundKit();

document.getElementById("homeBtn").addEventListener("click", () => { bgm.stop(); location.href = "../index.html"; });
document.getElementById("homeBtn2").addEventListener("click", () => { bgm.stop(); location.href = "../index.html"; });

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

// -------------------- 벡터 --------------------
const add = (a, b) => ({ x: a.x + b.x, y: a.y + b.y });
const sub = (a, b) => ({ x: a.x - b.x, y: a.y - b.y });
const mul = (a, k) => ({ x: a.x * k, y: a.y * k });
const dot = (a, b) => a.x * b.x + a.y * b.y;
const cross = (a, b) => a.x * b.y - a.y * b.x;
const len = (a) => Math.hypot(a.x, a.y);
const rot = (a, t) => ({ x: a.x * Math.cos(t) - a.y * Math.sin(t), y: a.x * Math.sin(t) + a.y * Math.cos(t) });
const dist2 = (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2;

// -------------------- 사각형 성질 판정 --------------------
// 네 점을 A→B→C→D 순서로 이은 사각형이 어떤 사각형인지 실제로 계산해 판정한다.
// 문제를 만들 때도, 오답 후보를 거를 때도 이 함수 하나만 쓴다 —
// 그래서 "정답 자리는 성질로만 정해진다"가 코드 수준에서 보장된다.
function classify(A, B, C, D) {
  const s = [sub(B, A), sub(C, B), sub(D, C), sub(A, D)]; // AB, BC, CD, DA
  const L = s.map(len);
  if (L.some((v) => v < 1e-4)) return { trap: false, para: false, rhom: false, rect: false, square: false, L, p1: false, p2: false };
  const parallel = (p, q) => Math.abs(cross(p, q)) < 0.05 * len(p) * len(q); // 약 3° 이내
  const p1 = parallel(s[0], s[2]); // AB ∥ CD
  const p2 = parallel(s[1], s[3]); // BC ∥ DA
  const para = p1 && p2;
  const trap = p1 || p2;
  const same = (a, b) => Math.abs(a - b) < 0.07 * Math.max(a, b);
  const rhom = para && same(L[0], L[1]) && same(L[1], L[2]) && same(L[2], L[3]);
  const rect = para && Math.abs(dot(sub(A, B), sub(C, B))) < 0.06 * L[0] * L[1];
  return { trap, para, rhom, rect, square: rhom && rect, p1, p2, L };
}

// 미리보기가 꼬여 보이지 않도록 볼록 사각형만 쓴다
function convex(A, B, C, D) {
  const p = [A, B, C, D];
  let sign = 0;
  for (let i = 0; i < 4; i++) {
    const z = cross(sub(p[(i + 1) % 4], p[i]), sub(p[(i + 2) % 4], p[(i + 1) % 4]));
    if (Math.abs(z) < 1e-5) return false;
    const s = z > 0 ? 1 : -1;
    if (sign === 0) sign = s;
    else if (s !== sign) return false;
  }
  return true;
}

// -------------------- 문제 --------------------
const CONDS = {
  1: [
    { key: "trap", text: "사다리꼴", test: (c) => c.trap },
    { key: "rect", text: "직사각형", test: (c) => c.rect },
  ],
  2: [
    { key: "para", text: "평행사변형", test: (c) => c.para },
    { key: "rhom", text: "마름모", test: (c) => c.rhom },
  ],
  3: [
    { key: "square", text: "정사각형", test: (c) => c.square },
    { key: "paraNotRhom", text: "평행사변형이지만 마름모는 아닌 사각형", test: (c) => c.para && !c.rhom },
    { key: "trapNotPara", text: "사다리꼴이지만 평행사변형은 아닌 사각형", test: (c) => c.trap && !c.para },
  ],
};

// 좌표는 "코트의 짧은 변 = 1"인 단위 공간에 두고, 그릴 때만 화면 좌표로 바꾼다.
// 이렇게 해야 화면 비율이 어떻든 정사각형이 정사각형으로 보인다.
function court() {
  const { w, h } = dims;
  const x0 = w * 0.05, x1 = w * 0.95;
  const y0 = topBand().y1 + h * 0.06, y1 = h * 0.93;
  const s = Math.min(x1 - x0, y1 - y0);
  return { x0, y0, x1, y1, cx: (x0 + x1) / 2, cy: (y0 + y1) / 2, s, hx: (x1 - x0) / 2 / s, hy: (y1 - y0) / 2 / s };
}
function toScreen(p) { const c = court(); return { x: c.cx + p.x * c.s, y: c.cy + p.y * c.s }; }

function genRound(level) {
  const cond = pick(CONDS[level]);
  const c = court();
  for (let attempt = 0; attempt < 400; attempt++) {
    // 코트 전체를 쓰도록 크게 벌려서, 손만 뻗지 않고 실제로 걸어서 이동해야 짚을 수 있게 한다
    const size = 0.38 + Math.random() * 0.14;
    const th = Math.random() * Math.PI * 2;
    let u, v, k = 1;

    if (cond.key === "rect") {
      u = rot({ x: size, y: 0 }, th);
      v = rot({ x: 0, y: size * (0.55 + Math.random() * 0.35) }, th);
    } else if (cond.key === "square") {
      u = rot({ x: size, y: 0 }, th);
      v = rot({ x: 0, y: size }, th);
    } else if (cond.key === "rhom") {
      const a = (55 + Math.random() * 50) * Math.PI / 180;
      u = rot({ x: size, y: 0 }, th);
      v = rot({ x: size * Math.cos(a), y: size * Math.sin(a) }, th);
    } else {
      // 평행사변형 계열 · 사다리꼴 계열
      const a = (52 + Math.random() * 56) * Math.PI / 180;
      const l2 = size * (0.6 + Math.random() * 0.5);
      u = rot({ x: size, y: 0 }, th);
      v = rot({ x: l2 * Math.cos(a), y: l2 * Math.sin(a) }, th);
      // 사다리꼴은 한 쌍만 평행해야 하므로, 마주 보는 변의 길이를 일부러 다르게 만든다
      if (cond.key === "trap" || cond.key === "trapNotPara") {
        k = Math.random() < 0.5 ? 1.45 + Math.random() * 0.4 : 0.45 + Math.random() * 0.25;
      }
      if (cond.key === "paraNotRhom" && Math.abs(len(u) - len(v)) < size * 0.18) continue;
    }

    // 사각형의 무게중심이 코트 가운데쯤 오도록 B를 잡는다
    const D0 = add(u, mul(v, k));
    const g = mul(add(add(u, v), D0), 1 / 4);
    const B = mul(g, -1);
    const A = add(B, u), C = add(B, v), D = add(B, D0);

    if (!convex(A, B, C, D)) continue;
    if (!cond.test(classify(A, B, C, D))) continue;
    const fits = (p) => Math.abs(p.x) < c.hx - 0.05 && Math.abs(p.y) < c.hy - 0.05;
    if (![A, B, C, D].every(fits)) continue;

    // 오답 후보 3개 — 조건을 실제로 만족하지 않는 자리만 고른다
    const cands = [D];
    const far = (p) => cands.every((q) => dist2(q, p) > (size * 0.62) ** 2)
      && [A, B, C].every((q) => dist2(q, p) > (size * 0.42) ** 2);
    const ok = (p) => fits(p) && convex(A, B, C, p) && !cond.test(classify(A, B, C, p)) && far(p);

    // 가장 헷갈리는 오답 하나를 먼저 심는다 — 평행은 맞지만 길이가 달라 조건에서 벗어나는 자리
    for (const t of [1.55, 0.55, 1.35, 0.7]) {
      const p = add(A, mul(v, t));
      if (ok(p)) { cands.push(p); break; }
    }
    let guard = 0;
    while (cands.length < 4 && guard++ < 900) {
      const a2 = Math.random() * Math.PI * 2;
      const d = size * (0.42 + Math.random() * 0.85);
      const p = { x: D.x + Math.cos(a2) * d, y: D.y + Math.sin(a2) * d };
      if (ok(p)) cands.push(p);
    }
    if (cands.length < 4) continue;

    const order = cands.map((p, i) => ({ p, i })).sort(() => Math.random() - 0.5);
    return {
      cond, A, B, C,
      spots: order.map((o) => o.p),
      answerIdx: order.findIndex((o) => o.i === 0),
    };
  }
  // 여기까지 오는 일은 사실상 없지만, 못 뽑으면 가장 단순한 직사각형 문제로 대체한다
  const u = { x: 0.30, y: 0 }, v = { x: 0, y: 0.20 };
  const B = { x: -0.15, y: -0.10 };
  const A = add(B, u), C = add(B, v), D = add(B, add(u, v));
  return {
    cond: CONDS[1][1], A, B, C,
    spots: [D, { x: D.x + 0.26, y: D.y }, { x: D.x, y: D.y + 0.26 }, { x: D.x - 0.26, y: D.y + 0.2 }],
    answerIdx: 0,
  };
}

const poseTracker = new PoseTracker();
const body = new BodyInput(mode);
let pointerInput = null;

async function init() {
  await ensureFont();
  if (!isMuted()) bgm.play(showSoundHint);
  if (mode === "motion") {
    try {
      await startCamera(video, { width: 640, height: 480 });
      if (!isMuted()) bgm.play(showSoundHint);
    } catch (e) {
      document.getElementById("loadingText").textContent = "⚠️ 카메라를 찾을 수 없어요. 카메라 권한을 확인해주세요.";
      return;
    }
    document.getElementById("loadingText").textContent = "온몸 인식 AI를 불러오는 중…";
    await poseTracker.init();
  } else {
    pointerInput = new PointerInput(canvas);
  }
  document.getElementById("loadingPanel").style.display = "none";
  document.getElementById("raiseIcon").textContent = mode === "motion" ? "🙋" : "👆";
  document.getElementById("raiseText").textContent = mode === "motion" ? "손을 들어 주세요!" : "화면을 터치(클릭)하면 시작!";
  document.getElementById("raiseNote").style.display = mode === "motion" ? "block" : "none";
  document.getElementById("raisePanel").style.display = "flex";
  state = "raise";
  requestAnimationFrame(loop);
}

let state = "loading";
const holdFill = document.getElementById("holdFill");
const startGate = new StartGate(mode, holdFill);

let autoDiff, count, combo, maxCombo, playEndAt;
let round, roundAt, resolving, flashUntil = 0;
let hoverIdx = -1;   // 손이 올라가 있는 후보 자리
let dwell = 0;       // 그 자리에 머문 시간(ms) — 스치기만 해도 판정되지 않게 한다
let needRelease = false; // 새 라운드가 시작될 때 손이 이미 후보 위에 얹혀 있으면, 한 번 벗어나야 판정을 받는다
const DWELL_MS = 380;
let won = null;      // 대형 완성 연출 { start }
let netWave = 0;
let popups = [], bigPopups = [];
const shake = new ScreenShake();
const mascot = new Mascot();
const fever = new Fever();      // 3연속 정답이면 8초 피버
const reveal = new Reveal();    // 오답 뒤 정답을 잠깐 보여주는 상태
let feverBonus = 0;             // 피버 중에 맞힌 만큼 붙는 코인
let grades = [];
let recorder, comboShot, fallbackShot, autoRec, recordedBlob = null;
const recIndicator = document.getElementById("recIndicator");
let cursors = [];
let lastFrameAt = performance.now();

function topBand() { return hudBand(dims); }
function playerR() { return fluidPx(dims, 30, { min: 22, max: 44 }); }
function spotR() { return fluidPx(dims, 34, { min: 25, max: 50 }); }
function goalPos() { const c = court(); return { x: c.x1 - playerR() * 1.6, y: c.y0 + playerR() * 1.3 }; }

function newRound() {
  round = genRound(autoDiff.level);
  hoverIdx = -1;
  dwell = 0;
  needRelease = true;
  won = null;
  resolving = false;
  roundAt = performance.now();
}

function startCountdown() {
  state = "countdown";
  document.getElementById("countdownPanel").style.display = "flex";
  const numEl = document.getElementById("countNum");
  let n = 3;
  numEl.textContent = n;
  if (!isMuted()) sound.countBeep();
  const iv = setInterval(() => {
    n--;
    if (n <= 0) {
      clearInterval(iv);
      document.getElementById("countdownPanel").style.display = "none";
      if (!isMuted()) sound.go();
      showStartStamp(document.getElementById("startStamp"));
      beginPlay();
    } else {
      numEl.textContent = n;
      if (!isMuted()) sound.countBeep();
    }
  }, 700);
}

function beginPlay() {
  state = "playing";
  const prev = HighScore.get(UNIT);
  autoDiff = new AutoDifficulty(levelFromUrl(AutoDifficulty.startLevelFromHighScore(prev)));
  count = 0; combo = 0; maxCombo = 0;
  fever.reset(); reveal.clear(); feverBonus = 0;
  popups = []; bigPopups = [];
  playEndAt = performance.now() + 60000;
  lastFrameAt = performance.now();
  newRound();

  recorder = new ClipRecorder(canvas, sound, 24);
  recorder.prepare();
  comboShot = new ComboShot(canvas);
  fallbackShot = new ComboShot(canvas);
  autoRec = scheduleAutoRecording(recorder, {
    onStartVisual: () => {
      recIndicator.style.display = "flex";
      setTimeout(() => { if (!comboShot.captured) fallbackShot.capture(canvas); }, 1500);
    },
    onEndVisual: () => { recIndicator.style.display = "none"; },
    onDone: (blob) => { recordedBlob = blob; },
    fallbackMs: 8000,
  });
}

// 대형이 완성되면 네 번째 친구가 서고, 변이 하나씩 이어지고, 공이 사각형을 한 바퀴 돌아 골대로 간다
function succeed() {
  if (resolving) return;
  resolving = true;
  won = { start: performance.now() };
  count++; combo++;
  fever.hit(combo);
  if (fever.on) feverBonus += 2;
  if (combo > maxCombo) { maxCombo = combo; comboShot.capture(canvas); }
  autoDiff.reportCorrect();
  autoRec.trigger();
  if (!isMuted()) sound.pop();

  setTimeout(() => {
    if (state !== "playing") return;
    mascot.cheer();
    spawnGrade(grades, dims.w / 2, dims.h * 0.30, combo);
    netWave = performance.now();
    shake.trigger(8, 190);
    spawnBigPopup(bigPopups, dims.w / 2, dims.h * 0.82, `🤾 대형 완성! ${count}개`, CUTE.sun);
    if (!isMuted()) { sound.success(); if (combo >= 3 && combo % 3 === 0) sound.fever(); }
  }, 1050);
  setTimeout(() => { if (state === "playing") newRound(); }, 1550);
}

function fail(idx) {
  if (resolving) return;
  resolving = true;
  combo = 0;
  mascot.oops();
  fever.reset();
  autoDiff.reportWrong();
  shake.trigger(4, 150);
  flashUntil = performance.now() + 450;
  reveal.show({ idx: round.answerIdx, label: round.cond.text });
  const p = toScreen(round.spots[idx]);
  spawnPopup(popups, p.x, p.y - spotR(), `${round.cond.text}이 안 돼요`, CUTE.red);
  if (!isMuted()) sound.fizzle();
  setTimeout(() => { if (state === "playing") newRound(); }, 1400);
}

function endGame() {
  state = "result";
  const { medal, label } = medalFor(count, MEDALS);
  const prev = HighScore.get(UNIT);
  const best = Math.max(count, prev ? prev.count : 0);
  const isNewRecord = count > 0 && (!prev || count > prev.count);
  const earned = Coins.earn(medal, maxCombo) + feverBonus;
  Coins.add(earned);
  if (!prev || count >= prev.count) {
    HighScore.set(UNIT, { count, bestLevel: autoDiff.level, label: `${medal} ${count}${RECORD_SUFFIX}`, at: Date.now() });
  }

  const shot = comboShot.captured ? comboShot : fallbackShot;
  const previewVideo = document.getElementById("previewVideo");
  const saveVideoBtn = document.getElementById("saveVideoBtn");
  if (recordedBlob) {
    previewVideo.src = URL.createObjectURL(recordedBlob);
    previewVideo.style.display = "block";
    saveVideoBtn.style.display = "inline-block";
  }
  document.getElementById("savePhotoBtn").onclick = async () => {
    const blob = await shot.toBlob((c, w, h) => drawPhotoOverlay(c, w, h, { title: TITLE, record: count + RECORD_SUFFIX, medal }));
    downloadBlob(blob, `수학체육올림픽_사각형대형_${formatFileTimestamp()}.png`);
  };
  document.getElementById("saveVideoBtn").onclick = () => {
    if (recordedBlob) downloadBlob(recordedBlob, `수학체육올림픽_사각형대형_${formatFileTimestamp()}.${recorder.extension}`);
  };
  showResult({
    panel: document.getElementById("resultPanel"),
    medalEl: document.getElementById("resultMedal"),
    titleEl: document.getElementById("resultTitle"),
    ribbonEl: document.getElementById("recordRibbon"),
    coinEl: document.getElementById("coinEarn"),
    medal, title: `${label}!`,
    stats: [
      { el: document.getElementById("statCount"), value: count, suffix: "개" },
      { el: document.getElementById("statBest"), value: best, suffix: "개" },
      { el: document.getElementById("statCombo"), value: maxCombo, prefix: "🔥" },
    ],
    newRecord: isNewRecord,
    coins: earned,
    sound, muted: isMuted(),
  });
}

document.getElementById("retryBtn").addEventListener("click", () => {
  document.getElementById("resultPanel").style.display = "none";
  document.getElementById("raisePanel").style.display = "flex";
  startGate.since = 0; startGate.ready = false; holdFill.style.width = "0%";
  state = "raise";
});

document.getElementById("raisePanel").addEventListener("click", () => {
  if (state === "raise" && mode !== "motion") goReady();
});

// -------------------- 그리기 --------------------

function drawCourt(ctx) {
  const c = court();
  ctx.save();
  const grad = ctx.createLinearGradient(0, c.y0, 0, c.y1);
  grad.addColorStop(0, "rgba(64,180,110,0.18)");
  grad.addColorStop(1, "rgba(20,120,70,0.32)");
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.roundRect(c.x0, c.y0, c.x1 - c.x0, c.y1 - c.y0, fluidPx(dims, 22, { min: 15, max: 32 }));
  ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.4)";
  ctx.lineWidth = fluidPx(dims, 4, { min: 3, max: 6 });
  ctx.stroke();
  ctx.setLineDash([12, 11]);
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(c.x0, c.cy); ctx.lineTo(c.x1, c.cy); ctx.stroke();
  ctx.restore();
}

// 골대 — 대형이 완성되면 공이 이리로 날아온다
function drawGoal(ctx) {
  const g = goalPos();
  const R = playerR();
  const gw = R * 2.6, gh = R * 1.7;
  const since = performance.now() - netWave;
  const wave = netWave && since < 900 ? (1 - since / 900) * R * 0.5 : 0;
  ctx.save();
  ctx.strokeStyle = "rgba(255,255,255,0.75)";
  ctx.lineWidth = Math.max(1.5, R * 0.06);
  for (let i = 0; i <= 5; i++) {
    const x = g.x - gw / 2 + (gw * i) / 5;
    const sag = wave * Math.sin((Math.PI * i) / 5) * Math.sin(since / 55);
    ctx.beginPath();
    ctx.moveTo(x, g.y - gh / 2);
    ctx.quadraticCurveTo(x + sag, g.y, x, g.y + gh / 2);
    ctx.stroke();
  }
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = Math.max(4, R * 0.16);
  ctx.lineJoin = "round";
  ctx.beginPath();
  ctx.moveTo(g.x - gw / 2, g.y + gh / 2);
  ctx.lineTo(g.x - gw / 2, g.y - gh / 2);
  ctx.lineTo(g.x + gw / 2, g.y - gh / 2);
  ctx.lineTo(g.x + gw / 2, g.y + gh / 2);
  ctx.stroke();
  ctx.restore();
}

// 사각형 대형. edges(0~1)만큼만 변을 그려 "하나씩 이어진다"를 보여준다.
function drawFormation(ctx, quad, opts = {}) {
  const p = quad.map(toScreen);
  const lw = fluidPx(dims, 7, { min: 5, max: 11 });
  const edges = opts.edges === undefined ? 1 : opts.edges;

  ctx.save();
  if (opts.fill) {
    ctx.beginPath();
    p.forEach((q, i) => (i === 0 ? ctx.moveTo(q.x, q.y) : ctx.lineTo(q.x, q.y)));
    ctx.closePath();
    ctx.fillStyle = opts.fill;
    ctx.fill();
  }
  ctx.strokeStyle = opts.stroke || CUTE.ink;
  ctx.lineWidth = opts.lineWidth || lw;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  if (opts.dash) ctx.setLineDash([lw * 2, lw * 1.6]);
  for (let i = 0; i < 4; i++) {
    const k = Math.min(1, Math.max(0, edges * 4 - i));
    if (k <= 0) break;
    const a = p[i], b = p[(i + 1) % 4];
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(a.x + (b.x - a.x) * k, a.y + (b.y - a.y) * k);
    ctx.stroke();
  }
  ctx.restore();
  return p;
}

// 평행 표시(≫)·같은 길이 눈금(=)·직각 표시(⌐).
// 대형이 완성됐을 때만 띄워서 "왜 이게 평행사변형인지"가 눈에 보이게 한다.
function drawMarks(ctx, quad) {
  const p = quad.map(toScreen);
  const cls = classify(quad[0], quad[1], quad[2], quad[3]);
  const S = fluidPx(dims, 16, { min: 11, max: 24 });
  const sideVec = (i) => sub(p[(i + 1) % 4], p[i]);
  const midOf = (i) => mul(add(p[i], p[(i + 1) % 4]), 0.5);

  ctx.save();
  ctx.strokeStyle = "#ffffff";
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.lineWidth = Math.max(2.5, S * 0.22);

  // 평행한 변 쌍에 화살촉 (첫 쌍 1개, 둘째 쌍 2개)
  const pairs = [];
  if (cls.p1) pairs.push([0, 2]);
  if (cls.p2) pairs.push([1, 3]);
  pairs.forEach((pair, gi) => {
    for (const i of pair) {
      const d = sideVec(i);
      const L = len(d) || 1;
      const ux = d.x / L, uy = d.y / L;
      const m = midOf(i);
      for (let n = 0; n <= gi; n++) {
        const off = (n - gi / 2) * S * 0.55;
        const bx = m.x + ux * off, by = m.y + uy * off;
        ctx.beginPath();
        ctx.moveTo(bx - ux * S * 0.32 - uy * S * 0.32, by - uy * S * 0.32 + ux * S * 0.32);
        ctx.lineTo(bx, by);
        ctx.lineTo(bx - ux * S * 0.32 + uy * S * 0.32, by - uy * S * 0.32 - ux * S * 0.32);
        ctx.stroke();
      }
    }
  });

  // 길이가 같은 변에 눈금
  const groups = [];
  cls.L.forEach((L, i) => {
    const g = groups.find((gr) => Math.abs(gr.L - L) < 0.07 * Math.max(gr.L, L));
    if (g) g.idx.push(i); else groups.push({ L, idx: [i] });
  });
  groups.forEach((g) => {
    if (g.idx.length < 2) return;
    for (const i of g.idx) {
      const d = sideVec(i);
      const L = len(d) || 1;
      const ux = d.x / L, uy = d.y / L;
      const m = midOf(i);
      ctx.beginPath();
      ctx.moveTo(m.x - uy * S * 0.38, m.y + ux * S * 0.38);
      ctx.lineTo(m.x + uy * S * 0.38, m.y - ux * S * 0.38);
      ctx.stroke();
    }
  });

  // 직각 표시
  if (cls.rect) {
    for (let i = 0; i < 4; i++) {
      const v0 = p[i], a = p[(i + 3) % 4], b = p[(i + 1) % 4];
      const d1 = sub(a, v0), d2 = sub(b, v0);
      const n1 = len(d1) || 1, n2 = len(d2) || 1;
      const q = S * 0.8;
      ctx.beginPath();
      ctx.moveTo(v0.x + (d1.x / n1) * q, v0.y + (d1.y / n1) * q);
      ctx.lineTo(v0.x + (d1.x / n1) * q + (d2.x / n2) * q, v0.y + (d1.y / n1) * q + (d2.y / n2) * q);
      ctx.lineTo(v0.x + (d2.x / n2) * q, v0.y + (d2.y / n2) * q);
      ctx.stroke();
    }
  }
  ctx.restore();
}

function drawPlayer(ctx, pt, color, moodName, phase) {
  const R = playerR();
  const s = toScreen(pt);
  const by = bob(1.4, R * 0.09, phase);
  drawSticker(ctx, s.x, s.y + by, R, color, { lineWidth: Math.max(3, R * 0.15) });
  drawMood(ctx, s.x, s.y + by, R * 0.88, moodName);
}

function loop(tsMs) {
  requestAnimationFrame(loop);
  if (mode === "motion" && video.readyState < 2) return;
  const { ctx, w, h } = dims;
  ctx.save();
  shake.apply(ctx);
  if (mode === "motion") drawMirroredVideo(ctx, video, w, h);
  else drawFallbackBackground(ctx, w, h);
  drawDrifters(ctx, drifters, dims, 1 / 60);
  drawBunting(ctx, dims);

  let result = null;
  if (mode === "motion") result = poseTracker.detect(video, tsMs);
  body.update(result, w, h, video, pointerInput);
  if (mode === "motion" && state === "raise") {
    if (startGate.update(tsMs, body.isReady())) goReady();
  }
  cursors = body.cursors();

  if (state === "playing") stepGame();
  if (mode === "motion") drawSkeleton(ctx, body.joints, { color: CUTE.sun, lineWidth: fluidPx(dims, 7, { min: 5, max: 10 }) });

  if (state === "playing" || state === "raise") {
    grades = updateGrades(grades);
    drawGrades(ctx, grades, dims, fluidPx);
    if (state === "playing") mascot.draw(ctx, dims, fluidPx);
    drawPoseHint(ctx, dims, fluidPx, poseHint(body, mode));
  }

  if (state === "playing") drawFeverFrame(ctx, dims, fever, fluidPx);

  for (const c of cursors) drawGloveCursor(ctx, c.x, c.y, fluidPx(dims, 44, { min: 32, max: 62 }), { active: hoverIdx >= 0 });
  ctx.restore();
}

function goReady() {
  state = "ready";
  document.getElementById("raisePanel").style.display = "none";
  document.getElementById("readyPanel").style.display = "flex";
  if (!isMuted()) sound.click();
  setTimeout(async () => {
    document.getElementById("readyPanel").style.display = "none";
    await showRuleCard(document.getElementById("rulePanel"), RULE);
    startCountdown();
  }, 500);
}

function drawTopPanel(ctx, remain) {
  drawHudPanel(ctx, dims, fluidPx, {
    left: "네 번째 자리를 짚어 대형 완성!",
    right: `🔥 ${combo}   🏅 ${count}개   ⏱ ${Math.ceil(remain / 1000)}초`,
    headline: `${round.cond.text} 대형을 만들어요!`,
  });
}

function stepGame() {
  const { ctx, w, h } = dims;
  const now = performance.now();
  const dt = Math.min(0.06, (now - lastFrameAt) / 1000);
  lastFrameAt = now;
  const remain = Math.max(0, playEndAt - now);
  if (remain <= 0) { endGame(); return; }
  const armed = now - roundAt > 550;
  const SR = spotR();

  // 넉넉한 범위에서 "손이 올라간 자리"를 먼저 잡아 대형을 미리 보여주고,
  // 가운데에 잠깐(0.38초) 머물러야 실제로 짚은 것으로 친다.
  // 손이 스치기만 해도 판정되면 미리보기를 볼 틈이 없고, 모션 모드에서는 억울하게 틀린다.
  const prevHover = hoverIdx;
  hoverIdx = -1;
  if (!resolving) {
    let bestD = Infinity;
    for (const c of cursors) {
      round.spots.forEach((sp, i) => {
        const s = toScreen(sp);
        const d = Math.hypot(c.x - s.x, c.y - s.y);
        if (d < SR * 2.2 && d < bestD) { bestD = d; hoverIdx = i; }
      });
    }
    // 손이 후보에서 한 번 벗어나야 판정을 시작한다.
    // 그러지 않으면 앞 라운드에서 짚은 자리에 손을 얹어 둔 채로 다음 문제가 저절로 찍힌다.
    if (hoverIdx < 0) needRelease = false;
    if (hoverIdx !== prevHover) dwell = 0;
    if (!needRelease && hoverIdx >= 0 && bestD < SR * 0.95) dwell += dt * 1000;
    else dwell = Math.max(0, dwell - dt * 900);

    if (armed && !needRelease && hoverIdx >= 0 && dwell >= DWELL_MS) {
      if (hoverIdx === round.answerIdx) succeed(); else fail(hoverIdx);
      return;
    }
  }

  drawCourt(ctx);
  drawGoal(ctx);
  drawTopPanel(ctx, remain);

  const base = [round.A, round.B, round.C];

  if (!won) {
    // 세 친구를 잇는 선 — "여기까지는 정해져 있다"를 보여준다
    ctx.save();
    ctx.strokeStyle = "rgba(255,255,255,0.55)";
    ctx.lineWidth = fluidPx(dims, 5, { min: 4, max: 8 });
    ctx.lineCap = "round";
    const bp = base.map(toScreen);
    ctx.beginPath();
    ctx.moveTo(bp[0].x, bp[0].y);
    ctx.lineTo(bp[1].x, bp[1].y);
    ctx.lineTo(bp[2].x, bp[2].y);
    ctx.stroke();
    ctx.restore();

    // 손을 올린 자리로 대형을 미리 그려 준다 — 짚기 전에 모양을 확인할 수 있다
    if (hoverIdx >= 0) {
      const quad = [round.A, round.B, round.C, round.spots[hoverIdx]];
      drawFormation(ctx, quad, { fill: "rgba(255,255,255,0.22)", stroke: "rgba(255,255,255,0.85)", dash: true });
    }

    // 후보 자리 — 번갈아 반짝인다
    round.spots.forEach((sp, i) => {
      const s = toScreen(sp);
      const twinkle = 0.45 + Math.abs(Math.sin(now / 520 + i * 1.3)) * 0.35;
      const on = i === hoverIdx;
      ctx.save();
      ctx.globalAlpha = on ? 1 : twinkle;
      ctx.beginPath();
      ctx.arc(s.x, s.y, SR * (on ? 1.12 : 1), 0, Math.PI * 2);
      ctx.fillStyle = on ? "rgba(255,207,63,0.35)" : "rgba(255,255,255,0.18)";
      ctx.fill();
      ctx.setLineDash([SR * 0.36, SR * 0.28]);
      ctx.strokeStyle = on ? CUTE.sun : "#ffffff";
      ctx.lineWidth = fluidPx(dims, 5, { min: 3.5, max: 8 });
      ctx.stroke();
      ctx.restore();
      ctx.save();
      ctx.globalAlpha = on ? 1 : 0.8;
      ctx.font = `${SR * 1.05}px ${FONT}`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("👣", s.x, s.y);
      ctx.restore();

      // 머문 만큼 링이 차오른다 — 다 차면 그 자리로 결정된다
      if (on && dwell > 0) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(s.x, s.y, SR * 1.3, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(1, dwell / DWELL_MS));
        ctx.strokeStyle = CUTE.sun;
        ctx.lineWidth = fluidPx(dims, 7, { min: 5, max: 11 });
        ctx.lineCap = "round";
        ctx.stroke();
        ctx.restore();
      }
    });

    // 틀렸으면 정답 자리를 초록 링으로 짚어 준다
    if (reveal.on) {
      const s = toScreen(round.spots[reveal.data.idx]);
      drawAnswerRing(ctx, dims, fluidPx, s.x, s.y, SR * 1.25, reveal.data.label);
    }
  } else {
    // 대형 완성 — 변이 하나씩 이어지고, 다 이어지면 성질 표시가 붙는다
    const el = now - won.start;
    const quad = [round.A, round.B, round.C, round.spots[round.answerIdx]];
    const edges = Math.min(1, Math.max(0, (el - 200) / 420));
    drawFormation(ctx, quad, { fill: "rgba(81,207,102,0.28)", stroke: CUTE.green, edges });
    if (edges >= 1) drawMarks(ctx, quad);
  }

  // 친구들
  base.forEach((pt, i) => drawPlayer(ctx, pt, LANE_COLORS[i % LANE_COLORS.length], won ? "happy" : "idle", i));

  if (won) {
    const el = now - won.start;
    const R = playerR();
    const quad = [round.A, round.B, round.C, round.spots[round.answerIdx]];
    const p = quad.map(toScreen);

    // 네 번째 친구가 자리에 선다
    const pop = Math.min(1, el / 200);
    ctx.save();
    ctx.translate(p[3].x, p[3].y);
    ctx.scale(0.3 + pop * 0.7, 0.3 + pop * 0.7);
    drawSticker(ctx, 0, 0, R, CUTE.orange, { lineWidth: Math.max(3, R * 0.15) });
    drawMood(ctx, 0, 0, R * 0.88, "happy");
    ctx.restore();

    // 공이 사각형 변을 따라 한 바퀴 돈 뒤 골대로 날아간다
    const br = fluidPx(dims, 20, { min: 15, max: 30 });
    let bx = null, by = null;
    if (el >= 640 && el < 1050) {
      const t = (el - 640) / 410;
      const seg = Math.min(3, Math.floor(t * 4));
      const k = t * 4 - seg;
      const a = p[seg], b = p[(seg + 1) % 4];
      bx = a.x + (b.x - a.x) * k; by = a.y + (b.y - a.y) * k;
    } else if (el >= 1050 && el < 1450) {
      const t = (el - 1050) / 400;
      const g = goalPos();
      bx = p[0].x + (g.x - p[0].x) * t;
      by = p[0].y + (g.y - p[0].y) * t - Math.sin(Math.PI * t) * h * 0.14;
    }
    if (bx !== null) {
      ctx.save();
      ctx.translate(bx, by);
      ctx.rotate(el / 90);
      ctx.font = `${br * 2}px ${FONT}`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("⚽", 0, 0);
      ctx.restore();
    }
  }

  if (now < flashUntil) {
    ctx.save();
    ctx.fillStyle = "rgba(255,107,107,0.18)";
    ctx.fillRect(0, 0, w, h);
    ctx.restore();
  }

  popups = updatePopups(popups, dt); drawPopups(ctx, popups);
  bigPopups = updateBigPopups(bigPopups, dt); drawBigPopups(ctx, bigPopups);

  drawVignette(ctx, w, h, 0.16);
  drawChunkyText(ctx, won ? "대형 완성!" : "발자국 자리에 손을 올려 보고 짚어요!", w / 2, h * 0.965,
    fluidPx(dims, 16, { min: 12, max: 21 }), won ? CUTE.green : "#ffffff",
    { outline: CUTE.ink, outlineWidth: fluidPx(dims, 5, { min: 3, max: 7 }) });
  drawTimeUrgency(ctx, dims, fluidPx, remain);
  drawLevelStars(ctx, dims, autoDiff.level, fluidPx);
}

init();
</script>
